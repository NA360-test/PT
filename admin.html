<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Pranesh Trades</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="supabase-config.js" defer></script>
</head>
<body>

<div class="admin-shell">
  <header class="admin-header">
    <div class="wrap">
      <a href="index.html" class="logo">Pranesh Trades <span style="color:var(--muted); font-size:0.7rem; font-family:var(--font-mono);">/ admin</span></a>
      <button class="btn btn-ghost" id="logoutBtn" style="display:none;">Log out</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="wrap">

      <!-- LOGIN VIEW -->
      <div class="login-box" id="loginBox">
        <p class="eyebrow">Restricted</p>
        <h2>Admin Login</h2>
        <form id="loginForm">
          <label>
            Email
            <input type="email" name="email" required autocomplete="username">
          </label>
          <label>
            Password
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
          <p class="error-text" id="loginError"></p>
        </form>
      </div>

      <!-- LEADS VIEW -->
      <div id="leadsView" style="display:none;">
        <p class="eyebrow">Contact requests</p>
        <h2>Leads</h2>
        <p style="margin-bottom:24px;">Everyone who submitted the "Book a free strategy call" form on the site.</p>

        <div class="leads-table-wrap">
          <table class="leads-table" id="leadsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Stage</th>
              </tr>
            </thead>
            <tbody id="leadsBody"></tbody>
          </table>
          <p class="empty-state" id="emptyState" style="display:none;">No leads yet.</p>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
